<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Portfolio</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="container">
      <section class="card">
        <h1>Contact Me</h1>
        <p class="subtitle">Have a project in mind? Send me a message.</p>

        <form id="contactForm" novalidate>
          <div class="field">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required minlength="2" placeholder="Your name" />
            <small class="error" id="err-name"></small>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="you@example.com" />
            <small class="error" id="err-email"></small>
          </div>

          <div class="field">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" required minlength="3" placeholder="Project inquiry" />
            <small class="error" id="err-subject"></small>
          </div>

          <div class="field">
            <label for="message">Message</label>
            <textarea id="message" name="message" required minlength="10" rows="6" placeholder="Tell me about your project..." ></textarea>
            <small class="error" id="err-message"></small>
          </div>

          <button type="submit" id="submitBtn">Submit</button>
        </form>

        <div id="alert" class="alert hidden"></div>
      </section>
    </main>

    <script src="/main.js"></script>
  </body>
  </html>
